    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        invitationReconciliation:
          type: object
          properties:
            status:
              type: string
              enum: [HEALTHY, DEGRADED]
            consecutiveFailures:
              type: integer
              minimum: 0
            pendingResendCompensations:
              type: integer
              minimum: 0
            lastFailureAt:
              type: [string, "null"]
              format: date-time
            lastSuccessAt:
              type: [string, "null"]
              format: date-time
            lastCompletedAt:
              type: [string, "null"]
              format: date-time
            completionOverdue:
              type: boolean
            completionStaleAfterMs:
              type: [integer, "null"]
              minimum: 1
            lastRun:
              oneOf:
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum: [NEVER_RUN]
                    occurredAt:
                      type: "null"
                  required: [outcome, occurredAt]
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum: [RUNNING, FAILED]
                    occurredAt:
                      type: string
                      format: date-time
                  required: [outcome, occurredAt]
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum: [SKIPPED]
                    occurredAt:
                      type: string
                      format: date-time
                    reason:
                      type: string
                      enum: [COORDINATION_LOCK_UNAVAILABLE]
                  required: [outcome, occurredAt, reason]
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum: [COMPLETED]
                    occurredAt:
                      type: string
                      format: date-time
                    checked:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    failed:
                      type: integer
                      minimum: 0
                  required: [outcome, occurredAt, checked, updated, failed]
          required:
            - status
            - consecutiveFailures
            - pendingResendCompensations
            - lastFailureAt
            - lastSuccessAt
            - lastCompletedAt
            - completionOverdue
            - completionStaleAfterMs
            - lastRun
        operationalAlerts:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              lastAttemptAt:
                type: string
                format: date-time
              lastResult:
                type: string
                enum: [DELIVERED, NOT_CONFIGURED, DELIVERY_FAILED]
            required:
              - source
              - lastAttemptAt
              - lastResult
      required:
        - status
        - invitationReconciliation
        - operationalAlerts
