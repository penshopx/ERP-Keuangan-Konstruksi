openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Executive dashboard
  - name: projects
    description: Construction projects and cost control
  - name: invoices
    description: Billing and tax calculations
  - name: tax
    description: Tax compliance summaries
  - name: activity
    description: Immutable audit activity
  - name: access
    description: Authenticated user access and approvals
  - name: rab
    description: Reusable construction budget templates
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get executive dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project detail
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project update
  /projects/{projectId}/rab:
    get:
      operationId: getProjectRab
      tags: [projects]
      summary: Get project RAB baseline
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: RAB baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RabSummary"
  /projects/{projectId}/rab/versions:
    get:
      operationId: listProjectRabVersions
      tags: [projects, rab]
      summary: List project RAB baseline versions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: RAB baseline versions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RabVersion"
  /projects/{projectId}/rab/versions/{version}:
    get:
      operationId: getProjectRabVersion
      tags: [projects, rab]
      summary: Get a specific project RAB baseline version
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Requested RAB baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RabSummary"
  /projects/{projectId}/rab/import:
    post:
      operationId: importProjectRabTemplate
      tags: [projects, rab]
      summary: Import a reusable RAB template as a new draft baseline
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RabTemplateImportInput"
      responses:
        "201":
          description: Imported RAB baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RabSummary"
  /rab/templates:
    get:
      operationId: listRabTemplates
      tags: [rab]
      summary: List reusable RAB templates
      responses:
        "200":
          description: RAB template library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RabTemplate"
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List project invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create invoice with automatic tax calculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /tax/summary:
    get:
      operationId: getTaxSummary
      tags: [tax]
      summary: Get monthly tax summary
      parameters:
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tax summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxSummary"
  /tax/rules:
    get:
      operationId: listTaxRules
      tags: [tax]
      summary: List versioned tax rules
      responses:
        "200":
          description: Tax rule versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxRule"
    post:
      operationId: createTaxRule
      tags: [tax]
      summary: Add a new tax rule version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxRuleInput"
      responses:
        "201":
          description: Created tax rule version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxRule"
        "409":
          description: The effective period overlaps an existing rule with the same criteria
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List audit activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /me:
    get:
      operationId: getCurrentUser
      tags: [access]
      summary: Get the authenticated user's role and permissions
      responses:
        "200":
          description: Current user access profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /access/users:
    get:
      operationId: listAccessUsers
      tags: [access]
      summary: List users and their project assignments
      responses:
        "200":
          description: Access user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessUser"
  /access/invitations:
    get:
      operationId: listAccessInvitations
      tags: [access]
      summary: List pending and expired staff invitations
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessInvitationList"
    post:
      operationId: createAccessInvitation
      tags: [access]
      summary: Invite staff and prepare access before first sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessInvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessInvitation"
  /access/invitations/{invitationId}/revoke:
    post:
      operationId: revokeAccessInvitation
      tags: [access]
      summary: Revoke a pending staff invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessInvitation"
  /access/invitations/{invitationId}/resend:
    post:
      operationId: resendAccessInvitation
      tags: [access]
      summary: Resend an expired staff invitation with the same access
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resent invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessInvitation"
  /access/users/{userId}:
    put:
      operationId: updateAccessUser
      tags: [access]
      summary: Assign a role and projects to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessUserUpdate"
      responses:
        "200":
          description: Updated access user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
  /invoices/{invoiceId}/decision:
    post:
      operationId: decideInvoice
      tags: [invoices, access]
      summary: Approve or reject an invoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        invitationReconciliation:
          type: object
          properties:
            status:
              type: string
              enum: [HEALTHY, DEGRADED]
            consecutiveFailures:
              type: integer
              minimum: 0
            lastFailureAt:
              type: [string, "null"]
              format: date-time
            lastSuccessAt:
              type: [string, "null"]
              format: date-time
            lastCompletedAt:
              type: [string, "null"]
              format: date-time
            completionOverdue:
              type: boolean
            completionStaleAfterMs:
              type: [integer, "null"]
              minimum: 1
            lastRun:
              oneOf:
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum: [NEVER_RUN]
                    occurredAt:
                      type: "null"
                  required: [outcome, occurredAt]
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum: [RUNNING, FAILED]
                    occurredAt:
                      type: string
                      format: date-time
                  required: [outcome, occurredAt]
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum: [SKIPPED]
                    occurredAt:
                      type: string
                      format: date-time
                    reason:
                      type: string
                      enum: [COORDINATION_LOCK_UNAVAILABLE]
                  required: [outcome, occurredAt, reason]
                - type: object
                  properties:
                    outcome:
                      type: string
                      enum: [COMPLETED]
                    occurredAt:
                      type: string
                      format: date-time
                    checked:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    failed:
                      type: integer
                      minimum: 0
                  required: [outcome, occurredAt, checked, updated, failed]
          required:
            - status
            - consecutiveFailures
            - lastFailureAt
            - lastSuccessAt
            - lastCompletedAt
            - completionOverdue
            - completionStaleAfterMs
            - lastRun
      required:
        - status
        - invitationReconciliation
    DashboardSummary:
      type: object
      required: [activeProjects, portfolioValue, committedCost, cashPosition, budgetUtilization, alerts, cashflow]
      properties:
        activeProjects: { type: integer }
        portfolioValue: { type: number }
        committedCost: { type: number }
        cashPosition: { type: number }
        budgetUtilization: { type: number }
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        cashflow:
          type: array
          items:
            $ref: "#/components/schemas/CashflowPoint"
    Alert:
      type: object
      required: [id, severity, title, detail, action]
      properties:
        id: { type: string }
        severity: { type: string }
        title: { type: string }
        detail: { type: string }
        action: { type: string }
    CashflowPoint:
      type: object
      required: [month, inflow, outflow, net]
      properties:
        month: { type: string }
        inflow: { type: number }
        outflow: { type: number }
        net: { type: number }
    Project:
      type: object
      required: [id, code, name, owner, contractValue, budget, actualCost, progress, status, health, endDate]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        owner: { type: string }
        contractValue: { type: number }
        budget: { type: number }
        actualCost: { type: number }
        progress: { type: number }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        health: { type: string }
        endDate: { type: string }
    ProjectStatus:
      type: string
      enum: [PERSIAPAN, BERJALAN, SELESAI]
    ProjectInput:
      type: object
      required: [code, name, owner, contractValue, endDate]
      properties:
        code: { type: string }
        name: { type: string }
        owner: { type: string }
        contractValue: { type: number }
        endDate: { type: string }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        progress: { type: number }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [wbsCount, budgetUtilization, spi, cpi, recentInvoices]
          properties:
            wbsCount: { type: integer }
            budgetUtilization: { type: number }
            spi: { type: number }
            cpi: { type: number }
            recentInvoices:
              type: array
              items:
                $ref: "#/components/schemas/Invoice"
    RabSummary:
      type: object
      required: [projectId, version, status, totalBudget, committed, actual, remaining, items]
      properties:
        projectId: { type: string }
        version: { type: integer }
        status: { type: string }
        totalBudget: { type: number }
        committed: { type: number }
        actual: { type: number }
        remaining: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/RabItem"
    RabVersion:
      type: object
      required: [version, status, createdAt, updatedAt]
      properties:
        version: { type: integer }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RabItem:
      type: object
      required: [id, code, name, category, level, unit, quantity, unitPrice, materialCost, laborCost, equipmentCost, budget, committed, actual, variance, utilization]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        parentCode: { type: ["string", "null"] }
        level: { type: integer }
        unit: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        materialCost: { type: number }
        laborCost: { type: number }
        equipmentCost: { type: number }
        budget: { type: number }
        committed: { type: number }
        actual: { type: number }
        variance: { type: number }
        utilization: { type: number }
    RabTemplateItem:
      type: object
      required: [code, level, name, category, unit, quantity, unitPrice, materialCost, laborCost, equipmentCost, budget]
      properties:
        code: { type: string }
        parentCode: { type: ["string", "null"] }
        level: { type: integer }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        materialCost: { type: number }
        laborCost: { type: number }
        equipmentCost: { type: number }
        budget: { type: number }
    RabTemplate:
      type: object
      required: [id, name, projectType, description, sourceNote, itemCount, totalBudget, items]
      properties:
        id: { type: string }
        name: { type: string }
        projectType: { type: string }
        description: { type: string }
        sourceNote: { type: string }
        itemCount: { type: integer }
        totalBudget: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/RabTemplateItem"
    RabTemplateImportInput:
      type: object
      required: [templateId, priceFactor]
      properties:
        templateId: { type: string }
        priceFactor:
          type: number
          minimum: 0.01
          maximum: 100
          description: Multiplier used to adjust reference prices to the project location and period
    Invoice:
      type: object
      required: [id, number, projectId, projectCode, projectName, period, dpp, ppn, pphFinal, pph23, retention, total, status, issuedAt, taxRuleVersionId]
      properties:
        id: { type: string }
        number: { type: string }
        projectId: { type: string }
        projectCode: { type: string }
        projectName: { type: string }
        period: { type: string }
        dpp: { type: number }
        ppn: { type: number }
        pphFinal: { type: number }
        pph23: { type: number }
        retention: { type: number }
        total: { type: number }
        status: { type: string }
        issuedAt: { type: string }
        taxRuleVersionId: { type: [string, "null"] }
    InvoiceInput:
      type: object
      required: [projectId, period, issuedAt, dpp, retentionPercent, integrated, serviceType, qualification, hasSbu, supplierPkp, governmentCollector]
      properties:
        projectId: { type: string }
        period: { type: string }
        issuedAt: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        dpp: { type: number }
        retentionPercent: { type: number }
        integrated: { type: boolean }
        serviceType:
          type: string
          enum: [KONSTRUKSI, JASA_LAIN]
        qualification:
          type: string
          enum: [KECIL, MENENGAH, BESAR, TANPA_KUALIFIKASI, TIDAK_BERLAKU]
        hasSbu: { type: boolean }
        supplierPkp: { type: boolean }
        governmentCollector: { type: boolean }
    TaxSummary:
      type: object
      required: [period, pphFinal, ppn, pph23, total, subLedgerTotal, documents, reconciliation, reconciliationDetails]
      properties:
        period: { type: string }
        pphFinal: { type: number }
        ppn: { type: number }
        pph23: { type: number }
        total: { type: number }
        subLedgerTotal: { type: number }
        documents: { type: integer }
        reconciliation: { type: number }
        reconciliationDetails:
          type: array
          items:
            $ref: "#/components/schemas/TaxReconciliationDetail"
    TaxReconciliationDetail:
      type: object
      required: [invoiceId, invoiceNumber, projectName, issuedAt, ledgerTax, snapshotTax, variance]
      properties:
        invoiceId: { type: string }
        invoiceNumber: { type: string }
        projectName: { type: string }
        issuedAt: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        ledgerTax: { type: number }
        snapshotTax: { type: number }
        variance: { type: number }
    TaxRule:
      type: object
      required: [id, version, effectiveFrom, effectiveTo, regulatorySource, serviceType, qualification, requiresSbu, supplierPkp, governmentCollector, integrated, dppRateBasisPoints, ppnRateBasisPoints, pphFinalRateBasisPoints, pph23RateBasisPoints, createdAt, invoiceUsageCount]
      properties:
        id: { type: string }
        version: { type: string }
        effectiveFrom: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        effectiveTo: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        regulatorySource: { type: string }
        serviceType:
          type: string
          enum: [KONSTRUKSI, JASA_LAIN]
        qualification:
          type: ["string", "null"]
          enum: [KECIL, MENENGAH, BESAR, TANPA_KUALIFIKASI, null]
        requiresSbu: { type: boolean }
        supplierPkp: { type: boolean }
        governmentCollector: { type: boolean }
        integrated: { type: boolean }
        dppRateBasisPoints: { type: integer }
        ppnRateBasisPoints: { type: integer }
        pphFinalRateBasisPoints: { type: integer }
        pph23RateBasisPoints: { type: integer }
        createdAt: { type: string, format: date-time }
        invoiceUsageCount: { type: integer }
    TaxRuleInput:
      type: object
      required: [version, effectiveFrom, regulatorySource, serviceType, qualification, requiresSbu, supplierPkp, governmentCollector, integrated, dppRateBasisPoints, ppnRateBasisPoints, pphFinalRateBasisPoints, pph23RateBasisPoints]
      properties:
        version: { type: string, minLength: 1, maxLength: 100 }
        effectiveFrom: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        effectiveTo: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        regulatorySource: { type: string, minLength: 1, maxLength: 1000 }
        serviceType:
          type: string
          enum: [KONSTRUKSI, JASA_LAIN]
        qualification:
          type: ["string", "null"]
          enum: [KECIL, MENENGAH, BESAR, TANPA_KUALIFIKASI, null]
        requiresSbu: { type: boolean }
        supplierPkp: { type: boolean }
        governmentCollector: { type: boolean }
        integrated: { type: boolean }
        dppRateBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        ppnRateBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        pphFinalRateBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        pph23RateBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
    Activity:
      type: object
      required: [id, action, entity, detail, user, timestamp, tone]
      properties:
        id: { type: string }
        action: { type: string }
        entity: { type: string }
        detail: { type: string }
        user: { type: string }
        timestamp: { type: string }
        tone: { type: string }
    CurrentUser:
      type: object
      required: [userId, displayName, role, assignedProjectIds, permissions]
      properties:
        userId: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [DIRECTOR, PROJECT_MANAGER, SITE_MANAGER, FINANCE, TAX_STAFF, PROCUREMENT]
        assignedProjectIds:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    ApprovalDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        note:
          type: string
          maxLength: 500
    AccessUser:
      type: object
      required: [userId, displayName, role, assignedProjectIds]
      properties:
        userId: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [UNASSIGNED, DIRECTOR, PROJECT_MANAGER, SITE_MANAGER, FINANCE, TAX_STAFF, PROCUREMENT]
        assignedProjectIds:
          type: array
          items: { type: string }
    AccessUserUpdate:
      type: object
      required: [displayName, role, assignedProjectIds]
      properties:
        displayName: { type: string, minLength: 1 }
        role:
          type: string
          enum: [DIRECTOR, PROJECT_MANAGER, SITE_MANAGER, FINANCE, TAX_STAFF, PROCUREMENT]
        assignedProjectIds:
          type: array
          items: { type: string }
    AccessInvitation:
      type: object
      required: [id, email, displayName, role, assignedProjectIds, status, expiresAt, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role:
          type: string
          enum: [DIRECTOR, PROJECT_MANAGER, SITE_MANAGER, FINANCE, TAX_STAFF, PROCUREMENT]
        assignedProjectIds:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [PENDING, EXPIRED, REVOKED]
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AccessInvitationList:
      type: object
      required: [invitations, verification]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/AccessInvitation"
        verification:
          $ref: "#/components/schemas/AccessInvitationVerification"
    AccessInvitationVerification:
      type: object
      required: [status, message, lastSuccessfulVerificationAt]
      properties:
        status:
          type: string
          enum: [VERIFIED, DEGRADED]
        message:
          type: string
        lastSuccessfulVerificationAt:
          type: ["string", "null"]
          format: date-time
    AccessInvitationInput:
      type: object
      required: [email, displayName, role, assignedProjectIds]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1 }
        role:
          type: string
          enum: [DIRECTOR, PROJECT_MANAGER, SITE_MANAGER, FINANCE, TAX_STAFF, PROCUREMENT]
        assignedProjectIds:
          type: array
          items: { type: string }
