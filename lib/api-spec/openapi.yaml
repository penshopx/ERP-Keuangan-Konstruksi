openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Executive dashboard
  - name: projects
    description: Construction projects and cost control
  - name: invoices
    description: Billing and tax calculations
  - name: tax
    description: Tax compliance summaries
  - name: activity
    description: Immutable audit activity
  - name: access
    description: Authenticated user access and approvals
  - name: rab
    description: Reusable construction budget templates
  - name: petty-cash
    description: Project petty cash requests, settlement, and reconciliation
  - name: estimator
    description: SKKNI-aligned estimator competency profiles and versioned AHS calculations
  - name: copilot
    description: Read-only, project-scoped analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get executive dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /budget-alerts:
    get:
      operationId: listBudgetAlerts
      tags: [dashboard]
      summary: List budget control alerts
      responses:
        "200":
          description: Active and historical budget alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BudgetAlert" }
  /budget-alerts/{alertId}/acknowledge:
    post:
      operationId: acknowledgeBudgetAlert
      tags: [dashboard]
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Acknowledged alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetAlert" }
  /budget-alerts/{alertId}/resolve:
    post:
      operationId: resolveBudgetAlert
      tags: [dashboard]
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetAlert" }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project detail
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project update
  /ai/copilot:
    post:
      operationId: askProjectCopilot
      tags: [copilot]
      summary: Ask the read-only copilot about a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCopilotInput"
      responses:
        "200":
          description: Grounded copilot answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCopilotResponse"
        "400":
          description: The question cannot be handled by an allowed read-only tool
        "403":
          description: The user lacks permission for the selected data
        "404":
          description: The project is unavailable to the user
        "503":
          description: Copilot is disabled by the operational kill switch
        "504":
          description: Copilot timed out
        "429":
          description: Daily role or project quota reached
  /ai/usage:
    get:
      operationId: getCopilotUsage
      tags: [copilot]
      summary: Director-only copilot usage and limits
      responses:
        "200":
          description: Usage during the last seven UTC days and today's counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotUsageReport"
  /ai/limits:
    put:
      operationId: updateCopilotLimit
      tags: [copilot]
      summary: Director-only daily limit for a role or project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotLimit"
      responses:
        "200":
          description: Saved limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotLimit"
  /projects/{projectId}/rab:
    get:
      operationId: getProjectRab
      tags: [projects]
      summary: Get project RAB baseline
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: RAB baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RabSummary"
  /projects/{projectId}/rab/versions:
    get:
      operationId: listProjectRabVersions
      tags: [projects, rab]
      summary: List project RAB baseline versions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: RAB baseline versions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RabVersion"
  /projects/{projectId}/rab/versions/{version}:
    get:
      operationId: getProjectRabVersion
      tags: [projects, rab]
      summary: Get a specific project RAB baseline version
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Requested RAB baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RabSummary"
  /projects/{projectId}/rab/import:
    post:
      operationId: importProjectRabTemplate
      tags: [projects, rab]
      summary: Import a reusable RAB template as a new draft baseline
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RabTemplateImportInput"
      responses:
        "201":
          description: Imported RAB baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RabSummary"
  /competencies/catalog:
    get:
      operationId: listCompetencyCatalog
      tags: [estimator]
      summary: List referenced competency scheme entries
      responses:
        "200":
          description: Competency catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompetencyCatalogEntry" }
  /competencies/profiles/{userId}:
    get:
      operationId: getCompetencyProfile
      tags: [estimator]
      summary: Get a user's professional competency profile
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Competency profile
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserCompetencyProfile" }
    put:
      operationId: updateCompetencyProfile
      tags: [estimator]
      summary: Add or update a user's competency profile
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCompetencyProfileInput" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCompetencyProfile" }
  /ahs/templates:
    get:
      operationId: listAhsTemplates
      tags: [estimator]
      summary: List versioned AHS templates effective on a date
      parameters:
        - name: effectiveDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: AHS templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AhsTemplate" }
  /projects/{projectId}/estimates/preview:
    post:
      operationId: previewRabEstimate
      tags: [estimator]
      summary: Calculate a deterministic AHS estimate from effective resource prices
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimatePreviewInput" }
      responses:
        "200":
          description: Estimate preview with formula snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstimatePreview" }
  /projects/{projectId}/estimates/baseline:
    post:
      operationId: createRabEstimateBaseline
      tags: [estimator]
      summary: Create an existing RAB draft baseline from an approved preview
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateBaselineInput" }
      responses:
        "201":
          description: Created draft RAB baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RabSummary" }
  /projects/{projectId}/rab/transition:
    post:
      operationId: transitionRabBaseline
      tags: [estimator]
      summary: Submit, approve, or reject an RAB baseline
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RabTransitionInput" }
      responses:
        "200":
          description: Updated RAB baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RabVersion" }
  /projects/{projectId}/material-reconciliation:
    get:
      operationId: getProjectMaterialReconciliation
      tags: [projects, inventory]
      summary: Compare theoretical material requirements with recorded movements
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Deterministic material reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialReconciliationSummary"
  /projects/{projectId}/material-requirements:
    post:
      operationId: createMaterialRequirement
      tags: [projects, inventory]
      summary: Add a versioned material analysis requirement and effective waste tolerance
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialRequirementInput"
      responses:
        "201":
          description: Created material requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialRequirement"
  /projects/{projectId}/inventory-movements:
    post:
      operationId: createInventoryMovement
      tags: [projects, inventory]
      summary: Record a project inventory movement with source evidence
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMovementInput"
      responses:
        "201":
          description: Recorded movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovement"
  /projects/{projectId}/material-exceptions/{exceptionId}:
    patch:
      operationId: updateMaterialVarianceException
      tags: [projects, inventory]
      summary: Classify, disposition, or close a material variance exception
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: exceptionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialExceptionUpdate"
      responses:
        "200":
          description: Updated exception
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialVarianceException"
  /projects/{projectId}/commitments:
    get:
      operationId: listProjectCommitments
      tags: [projects]
      summary: List project commitments
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project commitments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Commitment" }
    post:
      operationId: createProjectCommitment
      tags: [projects]
      summary: Create a draft PO, SPK, or subcontract commitment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitmentInput" }
      responses:
        "201":
          description: Draft commitment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commitment" }
  /projects/{projectId}/commitments/{commitmentId}/transition:
    post:
      operationId: transitionProjectCommitment
      tags: [projects]
      summary: Submit, approve, reject, receive, invoice, amend, or reverse a commitment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: commitmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitmentTransitionInput" }
      responses:
        "200":
          description: Updated commitment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commitment" }
  /rab/templates:
    get:
      operationId: listRabTemplates
      tags: [rab]
      summary: List reusable RAB templates
      responses:
        "200":
          description: RAB template library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RabTemplate"
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List project invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create invoice with automatic tax calculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /petty-cash:
    get:
      operationId: listPettyCashRequests
      tags: [petty-cash]
      summary: List petty cash requests
      parameters:
        - name: projectId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Petty cash requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PettyCashRequest"
    post:
      operationId: createPettyCashRequest
      tags: [petty-cash]
      summary: Request project petty cash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PettyCashRequestInput"
      responses:
        "201":
          description: Created petty cash request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashRequest"
  /petty-cash/{requestId}/decision:
    post:
      operationId: decidePettyCashRequest
      tags: [petty-cash]
      summary: Approve or reject a petty cash request
      parameters:
        - $ref: "#/components/parameters/PettyCashRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PettyCashDecisionInput"
      responses:
        "200":
          description: Decided petty cash request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashRequest"
  /petty-cash/{requestId}/disburse:
    post:
      operationId: disbursePettyCashRequest
      tags: [petty-cash]
      summary: Record approved petty cash disbursement
      parameters:
        - $ref: "#/components/parameters/PettyCashRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PettyCashDisbursementInput"
      responses:
        "200":
          description: Disbursed petty cash request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashRequest"
  /petty-cash/{requestId}/settle:
    post:
      operationId: settlePettyCashRequest
      tags: [petty-cash]
      summary: Submit petty cash usage, receipts, and returned balance
      parameters:
        - $ref: "#/components/parameters/PettyCashRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PettyCashSettlementInput"
      responses:
        "200":
          description: Settled petty cash request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashRequest"
  /petty-cash/{requestId}/reconcile:
    post:
      operationId: reconcilePettyCashRequest
      tags: [petty-cash]
      summary: Verify settlement and reconcile physical cash
      parameters:
        - $ref: "#/components/parameters/PettyCashRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PettyCashReconciliationInput"
      responses:
        "200":
          description: Reconciled petty cash request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCashRequest"
  /tax/summary:
    get:
      operationId: getTaxSummary
      tags: [tax]
      summary: Get monthly tax summary
      parameters:
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tax summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxSummary"
  /tax/rules:
    get:
      operationId: listTaxRules
      tags: [tax]
      summary: List versioned tax rules
      responses:
        "200":
          description: Tax rule versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxRule"
    post:
      operationId: createTaxRule
      tags: [tax]
      summary: Add a new tax rule version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxRuleInput"
      responses:
        "201":
          description: Created tax rule version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxRule"
        "409":
          description: The effective period overlaps an existing rule with the same criteria
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List audit activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /me:
    get:
      operationId: getCurrentUser
      tags: [access]
      summary: Get the authenticated user's role and permissions
      responses:
        "200":
          description: Current user access profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /access/users:
    get:
      operationId: listAccessUsers
      tags: [access]
      summary: List users and their project assignments
      responses:
        "200":
          description: Access user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessUser"
  /access/invitations:
    get:
      operationId: listAccessInvitations
      tags: [access]
      summary: List and filter staff invitation history
      parameters:
        - name: email
          in: query
          description: Match the invited or accepting email address
          schema:
            type: string
            maxLength: 320
        - name: status
          in: query
          description: Filter invitations by their current status
          schema:
            type: string
            enum: [PENDING, EXPIRED, REVOKED, ACCEPTED]
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessInvitationList"
    post:
      operationId: createAccessInvitation
      tags: [access]
      summary: Invite staff and prepare access before first sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessInvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessInvitation"
  /access/invitations/{invitationId}/revoke:
    post:
      operationId: revokeAccessInvitation
      tags: [access]
      summary: Revoke a pending staff invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessInvitation"
  /access/invitations/{invitationId}/resend:
    post:
      operationId: resendAccessInvitation
      tags: [access]
      summary: Resend an expired staff invitation with the same access
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resent invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessInvitation"
  /access/users/{userId}:
    put:
      operationId: updateAccessUser
      tags: [access]
      summary: Assign a role and projects to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessUserUpdate"
      responses:
        "200":
          description: Updated access user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
  /invoices/{invoiceId}/decision:
    post:
      operationId: decideInvoice
      tags: [invoices, access]
      summary: Approve or reject an invoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
components:
  parameters:
    PettyCashRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ProjectCopilotInput:
      type: object
      required: [projectId, prompt]
      additionalProperties: false
      properties:
        projectId:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
    CopilotCitation:
      type: object
      required: [source]
      properties:
        source:
          type: string
        id:
          type: string
    ProjectCopilotResponse:
      type: object
      required: [answer, tool, result, sources]
      properties:
